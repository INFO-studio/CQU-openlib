<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="重庆大学资源共享计划 CQU-openlib — 非官方、非营利的校园资源文档站"
    />
    <title>CQU-openlib</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- Sidebar data; without this it waits on the entry chunk to mount. -->
    <link
      rel="preload"
      href="/nav-index.json"
      as="fetch"
      crossorigin="anonymous"
    />
    <script>
      (() => {
        try {
          let preferences = null;
          try {
            preferences = JSON.parse(
              localStorage.getItem('cqu-openlib-preferences') || 'null',
            );
          } catch {}
          const stored =
            preferences?.theme || localStorage.getItem('cqu-openlib-theme');
          const theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.dataset.theme = theme;
        } catch {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/app/main.tsx"></script>
  </body>
</html>
